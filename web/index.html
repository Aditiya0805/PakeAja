<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="PakeAja - Smart Wardrobe & AI Stylist">
  <meta name="theme-color" content="#C4202F">

  <!-- Preconnect ke CDN Firebase agar inisialisasi super cepat di Chrome iPhone 13 & mobile -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firebaseinstallations.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PakeAja">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PakeAja</title>
  <link rel="manifest" href="manifest.json">

  <!-- Konfigurasi Firebase Web PakeAja -->
  <script>
    window.firebaseConfig = {
      apiKey: atob("QUl6YVN5Q0gxNTZaRTFObHRBbUdyQ1llcVpEQm5RMmx2SmE5cEtB"),
      authDomain: "pakeaja.firebaseapp.com",
      projectId: "pakeaja",
      storageBucket: "pakeaja.firebasestorage.app",
      messagingSenderId: "548065215093",
      appId: "1:548065215093:web:a6471475a6691238106e3c"
    };

    // Polyfill proteksi WebKit iOS (Safari & Chrome iOS) untuk FlutterFire web_utils:
    // Mencegah crash "Null check operator used on a null value" ketika browser melempar
    // DOMException / TypeError / Network Error yang tidak memiliki properti .code bertipe String.
    (function() {
      function ensureCode(proto) {
        if (!proto) return;
        try {
          var desc = Object.getOwnPropertyDescriptor(proto, 'code');
          if (!desc || desc.configurable) {
            Object.defineProperty(proto, 'code', {
              get: function() {
                return (typeof this._customCode === 'string') ? this._customCode : 'auth/network-request-failed';
              },
              set: function(v) {
                this._customCode = v;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (_) {}
      }

      if (typeof Error !== 'undefined') ensureCode(Error.prototype);
      if (typeof TypeError !== 'undefined') ensureCode(TypeError.prototype);
      if (typeof DOMException !== 'undefined') ensureCode(DOMException.prototype);
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F6F7FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #pakeaja-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #FFFFFF 0%, #F6F7FA 100%);
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }
    .logo-badge {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, #EF5537 0%, #C4202F 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(196, 32, 47, 0.28);
      margin-bottom: 16px;
      animation: float 2.4s ease-in-out infinite;
    }
    .logo-icon {
      font-size: 34px;
      color: white;
      line-height: 1;
    }
    .app-title {
      font-size: 24px;
      font-weight: 800;
      color: #1A1D23;
      margin: 0 0 4px 0;
      letter-spacing: -0.5px;
    }
    .app-subtitle {
      font-size: 13px;
      color: #757575;
      margin: 0 0 24px 0;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(196, 32, 47, 0.15);
      border-top-color: #C4202F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    #fallback-hint {
      display: none;
      margin-top: 20px;
      font-size: 12.5px;
      color: #8E959E;
      text-align: center;
      max-width: 280px;
    }
    #reload-btn {
      display: none;
      margin-top: 10px;
      padding: 8px 18px;
      background: #C4202F;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="pakeaja-loader">
    <div class="logo-badge">
      <span class="logo-icon">🧥</span>
    </div>
    <h1 class="app-title">PakeAja</h1>
    <p class="app-subtitle">Menyiapkan outfit cerdasmu...</p>
    <div class="spinner"></div>
    <div id="fallback-hint">Memuat membutuhkan waktu sedikit lebih lama di browser ini...</div>
    <button id="reload-btn" onclick="window.location.reload()">Muat Ulang</button>
  </div>

  <script>
    // Munculkan opsi muat ulang jika jaringan lambat / stuck di browser
    setTimeout(function() {
      var hint = document.getElementById('fallback-hint');
      var btn = document.getElementById('reload-btn');
      if (hint && btn && document.getElementById('pakeaja-loader')) {
        hint.style.display = 'block';
        btn.style.display = 'inline-block';
      }
    }, 8000);

    // Hapus loader saat Flutter selesai merender frame pertama
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('pakeaja-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 300);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
