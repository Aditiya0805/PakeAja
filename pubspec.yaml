name: pakeaja
description: "Aplikasi rekomendasi outfit harian. Bingung mau pake apa? PakeAja."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  google_sign_in: ^6.2.2

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Navigation
  go_router: ^13.0.0

  # Image Handling
  image_picker: ^1.0.0
  image_cropper: ^12.2.1
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.0
  permission_handler: ^11.4.0

  # UI & Design
  gap: ^3.0.0
  intl: ^0.19.0

  # Logging & Error Handling
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
